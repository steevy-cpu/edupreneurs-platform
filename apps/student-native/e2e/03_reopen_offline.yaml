# Force-quit and reopen (backend still unreachable): everything must still be there.
appId: ht.edupreneur.student.dev
---
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "5 action\\(s\\) en attente de synchronisation"
    timeout: 60000
- takeScreenshot: shots/14-home-after-restart-offline
- scrollUntilVisible:
    element: "Progrès et synchronisation"
    direction: UP
- tapOn: "Progrès et synchronisation"
- scrollUntilVisible:
    element: "4 bonne\\(s\\) réponse\\(s\\)"
    direction: DOWN
- assertVisible: "5 question\\(s\\) répondue\\(s\\) sur 5"
- takeScreenshot: shots/15-progress-after-restart-offline
- scrollUntilVisible:
    element: "Synchroniser maintenant"
    direction: UP
- tapOn: "Synchroniser maintenant"
- extendedWaitUntil:
    visible: "Serveur injoignable.*"
    timeout: 60000
- takeScreenshot: shots/16-sync-attempt-offline
