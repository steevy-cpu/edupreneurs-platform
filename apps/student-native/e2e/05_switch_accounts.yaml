# Sign out, sign in as the other student: no trace of the first student's progress.
# Run with: -e EMAIL_B=... -e PASSWORD_B=... -e EMAIL=... -e PASSWORD=...
appId: ht.edupreneur.student.dev
---
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Bonjour student.a"
    timeout: 90000
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "Ma progression"
    timeout: 20000
- scrollUntilVisible:
    element: "Se déconnecter"
    direction: DOWN
# Let the scroll settle: a tap during the fling is swallowed by the scroll view.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Se déconnecter"
- extendedWaitUntil:
    visible: "Se connecter"
    timeout: 20000
- takeScreenshot: shots/18-signed-out
- tapOn:
    id: "sign-in-email"
- inputText: ${EMAIL_B}
- tapOn:
    id: "sign-in-password"
- inputText: ${PASSWORD_B}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "sign-in-submit"
# iOS may offer to save the password in its keychain; decline so the test stays deterministic.
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Bonjour student.b"
    timeout: 30000
# The lesson file is shared content, so B can continue it — with B's own (empty) progress.
- assertVisible: "0 sur 5 exercices faits"
- assertNotVisible: "5 sur 5 exercices faits"
- assertNotVisible: ".*en attente de synchronisation.*"
- takeScreenshot: shots/19-home-student-b
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "Ma progression"
    timeout: 20000
- assertVisible: "student.b@edupreneur.test"
- scrollUntilVisible:
    element: "0 question\\(s\\) répondue\\(s\\) sur 5"
    direction: DOWN
- assertNotVisible: "5 question\\(s\\) répondue\\(s\\) sur 5"
- takeScreenshot: shots/20-profile-student-b-empty
- scrollUntilVisible:
    element: "Se déconnecter"
    direction: DOWN
# Let the scroll settle: a tap during the fling is swallowed by the scroll view.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Se déconnecter"
- extendedWaitUntil:
    visible: "Se connecter"
    timeout: 20000
- tapOn:
    id: "sign-in-email"
- inputText: ${EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "sign-in-submit"
# iOS may offer to save the password in its keychain; decline so the test stays deterministic.
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Bonjour student.a"
    timeout: 30000
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "Ma progression"
    timeout: 20000
- scrollUntilVisible:
    element: "5 question\\(s\\) répondue\\(s\\) sur 5"
    direction: DOWN
    timeout: 30000
- takeScreenshot: shots/21-profile-student-a-back
