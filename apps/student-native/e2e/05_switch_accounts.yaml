# Sign out, sign in as the other student: no trace of the first student's progress.
# Run with: -e EMAIL_B=... -e PASSWORD_B=... -e EMAIL=... -e PASSWORD=...
appId: ht.edupreneur.student.dev
---
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Mes leçons"
    timeout: 90000
- scrollUntilVisible:
    element: "Se déconnecter"
    direction: DOWN
- tapOn: "Se déconnecter"
- extendedWaitUntil:
    visible: "Se connecter"
    timeout: 20000
- takeScreenshot: shots/18-signed-out
- tapOn:
    id: "sign-in-email"
- inputText: ${EMAIL_B}
- tapOn:
    id: "sign-in-password"
- inputText: ${PASSWORD_B}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: "Se connecter"
# iOS may offer to save the password in its keychain; decline so the test stays deterministic.
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Bonjour student.b"
    timeout: 30000
- scrollUntilVisible:
    element: "Tout est synchronisé"
    direction: DOWN
- takeScreenshot: shots/19-home-student-b
- scrollUntilVisible:
    element: "Progrès et synchronisation"
    direction: UP
- tapOn: "Progrès et synchronisation"
- scrollUntilVisible:
    element: "0 question\\(s\\) répondue\\(s\\) sur 5"
    direction: DOWN
- assertNotVisible: "5 question\\(s\\) répondue\\(s\\) sur 5"
- takeScreenshot: shots/20-progress-student-b-empty
# Back to home: the header button on iOS, the system back key on Android.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Retour"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- scrollUntilVisible:
    element: "Se déconnecter"
    direction: DOWN
- tapOn: "Se déconnecter"
- extendedWaitUntil:
    visible: "Se connecter"
    timeout: 20000
- tapOn:
    id: "sign-in-email"
- inputText: ${EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: "Se connecter"
# iOS may offer to save the password in its keychain; decline so the test stays deterministic.
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Bonjour student.a"
    timeout: 30000
- tapOn: "Progrès et synchronisation"
- scrollUntilVisible:
    element: "5 question\\(s\\) répondue\\(s\\) sur 5"
    direction: DOWN
    timeout: 30000
- takeScreenshot: shots/21-progress-student-a-back
