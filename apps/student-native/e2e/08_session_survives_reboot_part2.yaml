# Part 2: after the device was shut down and booted again, the app must open
# on the home screen (session restored from secure storage), not on sign-in.
appId: ht.edupreneur.student.dev
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Bonjour student.a"
    timeout: 90000
- assertNotVisible: "Se connecter"
- takeScreenshot: shots/26-session-restored-after-reboot
