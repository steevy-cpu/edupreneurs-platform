# Fresh install: sign in, choose grade and subject on the Apprendre tab, download
# the seed lesson from the learning path and open it. (Mobile-02 navigation.)
# Run with: maestro test -e EMAIL=... -e PASSWORD=... e2e/01_sign_in_and_save.yaml
appId: ht.edupreneur.student.dev
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Se connecter"
    timeout: 60000
- takeScreenshot: shots/01-sign-in
- tapOn:
    id: "sign-in-email"
- inputText: ${EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "sign-in-submit"
# iOS may offer to save the password in its keychain; decline so the test stays deterministic.
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Choisis ta première leçon"
    timeout: 30000
- assertVisible: "Bonjour student.a"
- assertVisible: "Profil"
- takeScreenshot: shots/03-home-empty
- tapOn: "Voir les matières"
- extendedWaitUntil:
    visible: "9AF"
    timeout: 20000
- tapOn: "9AF"
- tapOn: "Mathématiques"
- extendedWaitUntil:
    visible: "Équations du premier degré"
    timeout: 20000
- takeScreenshot: shots/04-path-top
- scrollUntilVisible:
    element:
      id: "download-1"
    direction: DOWN
- assertVisible: ".*Disponible en ligne.*"
- assertVisible: "Lire maintenant"
- takeScreenshot: shots/05-path-not-saved
- tapOn:
    id: "download-1"
- extendedWaitUntil:
    visible: ".*Résoudre une équation simple.*Enregistrée sur ce téléphone.*"
    timeout: 20000
- assertVisible: ".*Étape suivante.*"
- takeScreenshot: shots/06-path-saved
- tapOn: ".*Résoudre une équation simple.*Enregistrée sur ce téléphone.*"
- extendedWaitUntil:
    visible: "La règle de la balance"
    timeout: 10000
- assertVisible: "Faire les exercices"
- takeScreenshot: shots/07-reader
- scrollUntilVisible:
    element: "J’ai terminé la leçon"
    direction: DOWN
- takeScreenshot: shots/08-reader-bottom
