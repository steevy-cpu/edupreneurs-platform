# Fresh install: sign in, walk the screens, save the seed lesson for offline study.
# Run with: maestro test -e EMAIL=... -e PASSWORD=... e2e/01_sign_in_and_save.yaml
appId: ht.edupreneur.student.dev
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Se connecter"
    timeout: 60000
- takeScreenshot: shots/01-sign-in
- tapOn:
    id: "sign-in-email"
- inputText: ${EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${PASSWORD}
- takeScreenshot: shots/02-sign-in-filled
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: "Se connecter"
# iOS may offer to save the password in its keychain; decline so the test stays deterministic.
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Choisir ma classe et ma matière"
    timeout: 30000
- takeScreenshot: shots/03-home
- tapOn: "Choisir ma classe et ma matière"
- extendedWaitUntil:
    visible: "9AF.*"
    timeout: 20000
- tapOn: "9AF.*"
- tapOn: "Mathématiques"
- takeScreenshot: shots/04-select
- tapOn: "Voir les leçons"
- extendedWaitUntil:
    visible: "Enregistrer pour étudier hors ligne"
    timeout: 20000
- takeScreenshot: shots/05-lessons-not-saved
- tapOn: "Enregistrer pour étudier hors ligne"
- extendedWaitUntil:
    visible: "Ouvrir"
    timeout: 20000
- assertVisible: "Enregistrée sur ce téléphone.*"
- takeScreenshot: shots/06-lessons-saved
- tapOn: "Ouvrir"
- extendedWaitUntil:
    visible: "La règle de la balance"
    timeout: 10000
- takeScreenshot: shots/07-reader
- scrollUntilVisible:
    element: "Faire les exercices"
    direction: DOWN
- takeScreenshot: shots/08-reader-bottom
