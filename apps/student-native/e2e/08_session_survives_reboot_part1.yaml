# Part 1 of the device-restart check: sign in and reach home.
appId: ht.edupreneur.student.dev
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Se connecter"
    timeout: 60000
- tapOn:
    id: "sign-in-email"
- inputText: ${EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "sign-in-submit"
# iOS may offer to save the password in its keychain; decline so the test stays deterministic.
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Bonjour student.a"
    timeout: 30000
