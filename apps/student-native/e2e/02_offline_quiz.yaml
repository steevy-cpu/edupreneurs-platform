# Run while the backend is UNREACHABLE. Continues from the lesson reader (flow 01):
# answers the five questions (four right, one wrong), then checks Profil.
appId: ht.edupreneur.student.dev
---
- tapOn: "Faire les exercices"
- extendedWaitUntil:
    visible: "Question 1 sur 5"
    timeout: 15000
- takeScreenshot: shots/09-quiz-q1
- tapOn: "x = 7"
- tapOn: "Valider"
- extendedWaitUntil:
    visible: ".*Réponse enregistrée sur ce téléphone.*"
    timeout: 15000
- assertVisible: ".*Bonne réponse !.*"
- takeScreenshot: shots/10-quiz-q1-feedback
- tapOn: "Question suivante"
- assertVisible: "Question 2 sur 5"
- tapOn: "x = 6"
- tapOn: "Valider"
- extendedWaitUntil:
    visible: ".*Réponse enregistrée sur ce téléphone.*"
    timeout: 15000
- tapOn: "Question suivante"
- assertVisible: "Question 3 sur 5"
- tapOn: "x = 4"
- tapOn: "Valider"
- extendedWaitUntil:
    visible: ".*Réponse enregistrée sur ce téléphone.*"
    timeout: 15000
- tapOn: "Question suivante"
- assertVisible: "Question 4 sur 5"
- tapOn: "x = 13"
- tapOn: "Valider"
- extendedWaitUntil:
    visible: ".*Réponse enregistrée sur ce téléphone.*"
    timeout: 15000
- tapOn: "Question suivante"
- assertVisible: "Question 5 sur 5"
- tapOn: "x = 0"
- tapOn: "Valider"
- extendedWaitUntil:
    visible: ".*Réponse enregistrée sur ce téléphone.*"
    timeout: 15000
- assertVisible: ".*Ce n’est pas la bonne réponse.*La bonne réponse : .*"
- takeScreenshot: shots/11-quiz-q5-wrong
- tapOn: "Voir mon résultat"
- assertVisible: "Tu as 4 bonne\\(s\\) réponse\\(s\\) sur 5."
- assertVisible: "Résultat provisoire.*"
- takeScreenshot: shots/12-quiz-result
- tapOn: "Progrès et synchronisation"
- extendedWaitUntil:
    visible: "Ma progression"
    timeout: 20000
- scrollUntilVisible:
    element: "5 question\\(s\\) répondue\\(s\\) sur 5"
    direction: DOWN
- assertVisible: "En attente de synchronisation \\(5\\)"
- takeScreenshot: shots/13-profile-offline-pending
- scrollUntilVisible:
    element: "5 action\\(s\\) en attente de synchronisation"
    direction: DOWN
- assertNotVisible: "Tout est synchronisé"
