# Run while the backend is UNREACHABLE. Continues from the lesson reader (flow 01):
# answers the five questions (four right, one wrong). Scrolls where a small screen needs it.
appId: ht.edupreneur.student.dev
---
- scrollUntilVisible:
    element: "Faire les exercices"
    direction: DOWN
- tapOn: "Faire les exercices"
- extendedWaitUntil:
    visible: "Question 1 sur 5"
    timeout: 15000
- takeScreenshot: shots/09-quiz-q1
- assertVisible: "Question 1 sur 5"
- tapOn: "x = 7"
- scrollUntilVisible:
    element: "Valider"
    direction: DOWN
- tapOn: "Valider"
- extendedWaitUntil:
    visible: "Réponse enregistrée sur ce téléphone"
    timeout: 15000
- assertVisible: "Bonne réponse !"
- takeScreenshot: shots/10-quiz-q1-feedback
- tapOn: "Question suivante"
- assertVisible: "Question 2 sur 5"
- tapOn: "x = 6"
- scrollUntilVisible:
    element: "Valider"
    direction: DOWN
- tapOn: "Valider"
- extendedWaitUntil:
    visible: "Réponse enregistrée sur ce téléphone"
    timeout: 15000
- assertVisible: "Bonne réponse !"
- tapOn: "Question suivante"
- assertVisible: "Question 3 sur 5"
- tapOn: "x = 4"
- scrollUntilVisible:
    element: "Valider"
    direction: DOWN
- tapOn: "Valider"
- extendedWaitUntil:
    visible: "Réponse enregistrée sur ce téléphone"
    timeout: 15000
- assertVisible: "Bonne réponse !"
- tapOn: "Question suivante"
- assertVisible: "Question 4 sur 5"
- tapOn: "x = 13"
- scrollUntilVisible:
    element: "Valider"
    direction: DOWN
- tapOn: "Valider"
- extendedWaitUntil:
    visible: "Réponse enregistrée sur ce téléphone"
    timeout: 15000
- assertVisible: "Bonne réponse !"
- tapOn: "Question suivante"
- assertVisible: "Question 5 sur 5"
- tapOn: "x = 0"
- scrollUntilVisible:
    element: "Valider"
    direction: DOWN
- tapOn: "Valider"
- extendedWaitUntil:
    visible: "Réponse enregistrée sur ce téléphone"
    timeout: 15000
- assertVisible: "Ce n’est pas la bonne réponse."
- takeScreenshot: shots/11-quiz-q5-wrong
- tapOn: "Voir mon résultat"
- assertVisible: "Tu as 4 bonne\\(s\\) réponse\\(s\\) sur 5."
- takeScreenshot: shots/12-quiz-result
- tapOn: "Progrès et synchronisation"
- scrollUntilVisible:
    element: "5 question\\(s\\) répondue\\(s\\) sur 5"
    direction: DOWN
- takeScreenshot: shots/13-progress-offline-pending
- scrollUntilVisible:
    element: "5 action\\(s\\) en attente de synchronisation"
    direction: UP
