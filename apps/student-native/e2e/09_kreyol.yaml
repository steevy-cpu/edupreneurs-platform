# Signed in, backend reachable: switch the interface to Haitian Creole from Profil,
# download and read the Creole lesson, then switch back to French.
appId: ht.edupreneur.student.dev
---
- stopApp
- launchApp:
    clearState: false
# Language-neutral start: the app may already be in either language.
- extendedWaitUntil:
    visible:
      id: "tab-profile"
    timeout: 90000
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "student.a@edupreneur.test"
    timeout: 20000
- scrollUntilVisible:
    element: "Kreyòl"
    direction: DOWN
- tapOn: "Kreyòl"
- assertVisible: "Pwofil"
- assertVisible: "Aprann"
- takeScreenshot: shots/30-profile-kreyol
- tapOn:
    id: "tab-learn"
- extendedWaitUntil:
    visible: "Ekwasyon premye degre"
    timeout: 30000
- scrollUntilVisible:
    element: ".*Rezoud yon ekwasyon senp.*"
    direction: DOWN
    visibilityPercentage: 60
# The Creole copy is a separate download; skip if it is already on the phone.
- scrollUntilVisible:
    element:
      id: "download-1"
    direction: DOWN
    timeout: 6000
    optional: true
- tapOn:
    id: "download-1"
    optional: true
- extendedWaitUntil:
    visible: ".*Rezoud yon ekwasyon senp.*Anrejistre sou telefòn sa a.*"
    timeout: 30000
- takeScreenshot: shots/31-path-kreyol
- tapOn: ".*Rezoud yon ekwasyon senp.*Anrejistre sou telefòn sa a.*"
- extendedWaitUntil:
    visible: "Règ balans lan"
    timeout: 15000
- assertVisible: "Rezoud yon ekwasyon senp"
- takeScreenshot: shots/32-reader-kreyol
- tapOn: "Fè egzèsis yo"
- extendedWaitUntil:
    visible: "Kesyon 1 sou 5"
    timeout: 15000
- assertVisible: "Rezoud: x \\+ 5 = 12"
- takeScreenshot: shots/33-quiz-kreyol
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Bonjou student.a"
    timeout: 90000
- takeScreenshot: shots/34-home-kreyol
- tapOn:
    id: "tab-profile"
- scrollUntilVisible:
    element: "Français"
    direction: DOWN
- tapOn: "Français"
- assertVisible: "Profil"
