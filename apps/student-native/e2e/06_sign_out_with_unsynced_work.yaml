# Run while the backend is UNREACHABLE, signed in as student A with the lesson saved.
# One offline answer, then sign out from Profil: the app must warn, and "keep my work" must not lose it.
appId: ht.edupreneur.student.dev
---
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Continuer ma leçon"
    timeout: 60000
- takeScreenshot: shots/22-home-offline-from-cache
- tapOn:
    id: "home-continue"
- extendedWaitUntil:
    visible: "Faire les exercices"
    timeout: 20000
- tapOn: "Faire les exercices"
- tapOn: "x = 7"
- tapOn: "Valider"
- extendedWaitUntil:
    visible: ".*Réponse enregistrée sur ce téléphone.*"
    timeout: 15000
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "1 action\\(s\\) en attente de synchronisation.*"
    timeout: 90000
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "Ma progression"
    timeout: 20000
- scrollUntilVisible:
    element: "Se déconnecter"
    direction: DOWN
# Let the scroll settle: a tap during the fling is swallowed by the scroll view.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Se déconnecter"
- extendedWaitUntil:
    visible: "Travail non synchronisé"
    timeout: 10000
- assertVisible: "Synchroniser d’abord"
- assertVisible: "Se déconnecter et garder mon travail"
- takeScreenshot: shots/23-sign-out-warning
- tapOn: "Se déconnecter et garder mon travail"
- extendedWaitUntil:
    visible: "Se connecter"
    timeout: 20000
- takeScreenshot: shots/24-signed-out-work-kept
