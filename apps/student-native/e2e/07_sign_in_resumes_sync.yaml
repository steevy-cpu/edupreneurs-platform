# Backend reachable again: signing back in uploads the work that was kept on the phone.
appId: ht.edupreneur.student.dev
---
- tapOn:
    id: "sign-in-email"
- inputText: ${EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "sign-in-submit"
# iOS may offer to save the password in its keychain; decline so the test stays deterministic.
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Bonjour student.a"
    timeout: 60000
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "Ma progression"
    timeout: 20000
- scrollUntilVisible:
    element: "Tout est synchronisé"
    direction: DOWN
    timeout: 60000
- assertNotVisible: ".*en attente de synchronisation.*"
- takeScreenshot: shots/25-work-synced-after-sign-in
