# Backend reachable again: signing back in uploads the work that was kept on the phone.
appId: ht.edupreneur.student.dev
---
- tapOn:
    id: "sign-in-email"
- inputText: ${EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: "Se connecter"
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Mes leçons"
    timeout: 60000
- scrollUntilVisible:
    element: "Tout est synchronisé"
    direction: DOWN
    timeout: 60000
- takeScreenshot: shots/25-work-synced-after-sign-in
