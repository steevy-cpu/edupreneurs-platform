# Backend reachable again: signing back in uploads the work that was kept on the phone.
appId: ht.edupreneur.student.dev
---
- tapOn:
    id: "sign-in-email"
- inputText: ${EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${PASSWORD}
- tapOn: "Se connecter"
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Tout est synchronisé"
    timeout: 60000
- takeScreenshot: shots/25-work-synced-after-sign-in
