# Backend reachable. Fresh install: read the lesson ONLINE (no download), see the online badge,
# then open the exercises. Nothing is saved on the phone.
appId: ht.edupreneur.student.dev
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Se connecter"
    timeout: 60000
- tapOn:
    id: "sign-in-email"
- inputText: ${EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "sign-in-submit"
- extendedWaitUntil:
    visible: "Choisis ta première leçon"
    timeout: 30000
- tapOn: "Voir les matières"
- extendedWaitUntil:
    visible: "9AF"
    timeout: 20000
- tapOn: "9AF"
- tapOn: "Mathématiques"
- extendedWaitUntil:
    visible: "Équations du premier degré"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "read-1"
    direction: DOWN
- takeScreenshot: shots/20-path-two-actions
- tapOn:
    id: "read-1"
- extendedWaitUntil:
    visible: "La règle de la balance"
    timeout: 20000
- assertVisible: "En ligne · non téléchargée"
- assertNotVisible: "Disponible hors connexion"
- takeScreenshot: shots/21-reader-online
- scrollUntilVisible:
    element: "Télécharger pour étudier hors ligne"
    direction: DOWN
- takeScreenshot: shots/22-reader-online-download-button
- tapOn: "Faire les exercices"
- extendedWaitUntil:
    visible: "Question 1 sur 5"
    timeout: 20000
- assertVisible: "Tes réponses sont enregistrées sur ce téléphone, même sans connexion."
- takeScreenshot: shots/23-quiz-online
